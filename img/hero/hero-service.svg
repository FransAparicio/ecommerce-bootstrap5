<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Servicio técnico especializado">
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <linearGradient id="engranaje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f754b"/>
      <stop offset="1" stop-color="#0b5d3b"/>
    </linearGradient>
  </defs>

  <circle cx="470" cy="100" r="150" fill="#83dbaa" opacity="0.14" filter="url(#soft)"/>
  <circle cx="100" cy="370" r="120" fill="#d71920" opacity="0.10" filter="url(#soft)"/>

  <!-- Engranaje (truco de trazo discontinuo) -->
  <g transform="translate(300 215)">
    <circle r="92" fill="none" stroke="#16221f" stroke-width="30" stroke-dasharray="16 14"/>
    <circle r="76" fill="url(#engranaje)"/>
    <circle r="30" fill="#101817"/>
    <!-- Llave dentro del engranaje -->
    <g transform="rotate(-45)">
      <rect x="-8" y="-58" width="16" height="52" rx="8" fill="#ffffff"/>
      <path d="M-14 -6 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 M-7 -6 a7 7 0 1 1 14 0 a7 7 0 1 1 -14 0" fill="#ffffff" fill-rule="evenodd"/>
    </g>
  </g>

  <!-- Destornillador flotante -->
  <g transform="translate(95 120) rotate(-30)">
    <rect x="0" y="0" width="60" height="18" rx="9" fill="#d71920"/>
    <rect x="60" y="5" width="70" height="8" rx="4" fill="#c8dcd2"/>
    <rect x="130" y="6" width="22" height="6" rx="3" fill="#8fa89e"/>
  </g>

  <!-- Tarjeta de checklist -->
  <g transform="translate(420 290) rotate(6)">
    <rect x="6" y="8" width="150" height="120" rx="14" fill="#000000" opacity="0.25"/>
    <rect width="150" height="120" rx="14" fill="#ffffff"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h122 a14 14 0 0 1 14 14 v26 h-150 z" fill="#101817"/>
    <text x="20" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">DIAGNÓSTICO</text>
    <g>
      <circle cx="24" cy="62" r="9" fill="#0b5d3b"/>
      <path d="M20 62 l3 3 l6 -7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="58" width="80" height="8" rx="4" fill="#dcebe2"/>
      <circle cx="24" cy="90" r="9" fill="#0b5d3b"/>
      <path d="M20 90 l3 3 l6 -7" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="86" width="60" height="8" rx="4" fill="#dcebe2"/>
      <circle cx="24" cy="118" r="9" fill="none" stroke="#c8dcd2" stroke-width="2"/>
      <rect x="42" y="114" width="70" height="8" rx="4" fill="#e9f1ed"/>
    </g>
  </g>

  <!-- Escudo de garantía -->
  <g transform="translate(90 280) scale(0.55)">
    <path d="M60 0 L140 30 v70 c0 60 -40 95 -80 115 c-40 -20 -80 -55 -80 -115 v-70 z" fill="#101817"/>
    <path d="M60 14 L126 38 v62 c0 48 -30 77 -66 94 c-36 -17 -66 -46 -66 -94 v-62 z" fill="#0b5d3b"/>
    <path d="M38 78 l18 18 l38 -42" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#83dbaa" opacity="0.5">
    <circle cx="540" cy="180" r="5"/>
    <circle cx="560" cy="220" r="3"/>
    <circle cx="70" cy="400" r="4"/>
  </g>
</svg>
