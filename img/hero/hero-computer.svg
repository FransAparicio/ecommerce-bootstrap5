<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Setup de computadora con licencia de software">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f754b"/>
      <stop offset="1" stop-color="#83dbaa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f5ee"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="teclas" x="200" y="340" width="22" height="20" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" rx="2.5" fill="#0b5d3b"/>
    </pattern>
  </defs>

  <circle cx="480" cy="90" r="150" fill="#83dbaa" opacity="0.14" filter="url(#soft)"/>
  <circle cx="90" cy="380" r="110" fill="#d71920" opacity="0.10" filter="url(#soft)"/>

  <!-- Monitor -->
  <rect x="150" y="80" width="300" height="195" rx="14" fill="#101817"/>
  <rect x="162" y="92" width="276" height="171" rx="8" fill="url(#screen)"/>
  <g fill="#063b27" opacity="0.55">
    <rect x="182" y="116" width="90" height="10" rx="5"/>
    <rect x="182" y="138" width="140" height="10" rx="5"/>
    <rect x="182" y="160" width="60" height="10" rx="5"/>
    <rect x="262" y="160" width="110" height="10" rx="5"/>
    <rect x="182" y="182" width="170" height="10" rx="5"/>
    <rect x="182" y="204" width="45" height="10" rx="5"/>
    <rect x="247" y="204" width="120" height="10" rx="5"/>
  </g>
  <path d="M300 226 l0 22 6 -16 12 -3 z" fill="#d71920"/>

  <!-- Base del monitor -->
  <rect x="285" y="275" width="30" height="34" fill="#101817"/>
  <rect x="235" y="309" width="130" height="12" rx="6" fill="#101817"/>

  <!-- Teclado -->
  <rect x="185" y="335" width="230" height="60" rx="10" fill="#16221f"/>
  <rect x="197" y="343" width="206" height="44" rx="6" fill="url(#teclas)" opacity="0.85"/>

  <!-- Tarjeta de licencia -->
  <g transform="translate(400 250) rotate(8)">
    <rect x="6" y="8" width="150" height="95" rx="12" fill="#000000" opacity="0.25"/>
    <rect width="150" height="95" rx="12" fill="url(#card)"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h126 a12 12 0 0 1 12 12 v14 h-150 z" fill="#0b5d3b"/>
    <circle cx="20" cy="13" r="5" fill="#83dbaa"/>
    <text x="34" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">LICENCIA</text>
    <rect x="18" y="42" width="114" height="10" rx="5" fill="#cfe6d9"/>
    <rect x="18" y="60" width="80" height="10" rx="5" fill="#cfe6d9"/>
    <rect x="18" y="78" width="40" height="8" rx="4" fill="#d71920" opacity="0.85"/>
  </g>

  <!-- Llave flotante -->
  <g transform="translate(80 120) rotate(-12)">
    <circle cx="14" cy="14" r="14" fill="none" stroke="#83dbaa" stroke-width="6"/>
    <rect x="26" y="11" width="34" height="6" rx="3" fill="#83dbaa"/>
    <rect x="48" y="11" width="6" height="12" fill="#83dbaa"/>
    <rect x="58" y="11" width="6" height="9" fill="#83dbaa"/>
  </g>

  <g fill="#83dbaa" opacity="0.5">
    <circle cx="520" cy="330" r="5"/>
    <circle cx="545" cy="360" r="3"/>
    <circle cx="70" cy="250" r="4"/>
  </g>
</svg>
