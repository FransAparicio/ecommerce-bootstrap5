<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Licencias de software originales con activación inmediata">
  <defs>
    <linearGradient id="cabecera" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f754b"/>
      <stop offset="1" stop-color="#83dbaa"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <circle cx="470" cy="100" r="150" fill="#83dbaa" opacity="0.14" filter="url(#soft)"/>
  <circle cx="100" cy="370" r="120" fill="#d71920" opacity="0.10" filter="url(#soft)"/>

  <!-- Tarjeta de licencia grande -->
  <g transform="translate(140 70) rotate(-5)">
    <rect x="8" y="10" width="320" height="210" rx="20" fill="#000000" opacity="0.25"/>
    <rect width="320" height="210" rx="20" fill="#ffffff"/>
    <path d="M0 20 a20 20 0 0 1 20 -20 h280 a20 20 0 0 1 20 20 v46 h-320 z" fill="url(#cabecera)"/>
    <text x="28" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="2">LICENCIA DIGITAL</text>

    <!-- Logo de 4 paneles -->
    <g transform="translate(28 78)">
      <rect width="52" height="52" rx="7" fill="#83dbaa"/>
      <rect x="60" width="52" height="52" rx="7" fill="#0b5d3b"/>
      <rect y="60" width="52" height="52" rx="7" fill="#0b5d3b"/>
      <rect x="60" y="60" width="52" height="52" rx="7" fill="#83dbaa"/>
    </g>

    <!-- Líneas de clave -->
    <rect x="160" y="86" width="128" height="11" rx="5.5" fill="#dcebe2"/>
    <rect x="160" y="108" width="92" height="11" rx="5.5" fill="#dcebe2"/>
    <rect x="160" y="130" width="112" height="11" rx="5.5" fill="#dcebe2"/>

    <!-- Código de barras -->
    <g fill="#101817">
      <rect x="28" y="166" width="5" height="28"/>
      <rect x="38" y="166" width="3" height="28"/>
      <rect x="46" y="166" width="7" height="28"/>
      <rect x="58" y="166" width="4" height="28"/>
      <rect x="67" y="166" width="9" height="28"/>
      <rect x="81" y="166" width="3" height="28"/>
      <rect x="89" y="166" width="6" height="28"/>
    </g>
    <text x="160" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#697570" letter-spacing="1">ACTIVACIÓN INMEDIATA</text>
  </g>

  <!-- Llave flotante -->
  <g transform="translate(495 300) rotate(14)">
    <circle cx="16" cy="16" r="16" fill="none" stroke="#83dbaa" stroke-width="7"/>
    <rect x="30" y="13" width="40" height="7" rx="3.5" fill="#83dbaa"/>
    <rect x="56" y="13" width="7" height="14" fill="#83dbaa"/>
    <rect x="68" y="13" width="7" height="10" fill="#83dbaa"/>
  </g>

  <!-- Badge de activación -->
  <g transform="translate(80 90)">
    <circle cx="34" cy="34" r="34" fill="#0b5d3b"/>
    <circle cx="34" cy="34" r="34" fill="none" stroke="#83dbaa" stroke-width="3" opacity="0.5"/>
    <path d="M20 35 l10 10 l20 -22" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#83dbaa" text-anchor="middle">ACTIVADA</text>
  </g>

  <!-- Correo: llega al instante -->
  <g transform="translate(455 60) rotate(6)">
    <rect x="0" y="0" width="72" height="52" rx="8" fill="#ffffff"/>
    <path d="M0 8 a8 8 0 0 1 8 -8 h56 a8 8 0 0 1 8 8 v36 h-72 z" fill="#d71920" opacity="0.9"/>
    <path d="M4 10 l32 22 l32 -22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="26" width="52" height="6" rx="3" fill="#e2e9e6"/>
    <rect x="10" y="36" width="34" height="6" rx="3" fill="#e2e9e6"/>
  </g>

  <g fill="#83dbaa" opacity="0.5">
    <circle cx="540" cy="200" r="5"/>
    <circle cx="560" cy="240" r="3"/>
    <circle cx="60" cy="250" r="4"/>
  </g>
</svg>
