<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Teclado mecánico retroiluminado">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#e3f4ea"/>
      <stop offset="1" stop-color="#f4f8f6"/>
    </radialGradient>
    <pattern id="teclas" x="105" y="155" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="20" height="16" rx="3" fill="#e0ebe5"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="url(#glow)"/>
  <circle cx="300" cy="220" r="190" fill="#0b5d3b" opacity="0.06"/>

  <!-- Cuerpo -->
  <rect x="90" y="140" width="420" height="170" rx="18" fill="#16221f"/>
  <rect x="105" y="155" width="390" height="140" rx="10" fill="url(#teclas)"/>

  <!-- Barra espaciadora -->
  <rect x="215" y="272" width="170" height="14" rx="7" fill="#c8dcd2"/>

  <!-- Teclas acento -->
  <rect x="105" y="155" width="20" height="16" rx="3" fill="#d71920" opacity="0.9"/>
  <rect x="475" y="155" width="20" height="16" rx="3" fill="#0b5d3b"/>
  <rect x="475" y="180" width="20" height="16" rx="3" fill="#0b5d3b"/>

  <!-- LED -->
  <rect x="120" y="322" width="360" height="5" rx="2.5" fill="#83dbaa" opacity="0.8"/>

  <circle cx="120" cy="90" r="6" fill="#0b5d3b" opacity="0.2"/>
  <circle cx="480" cy="360" r="8" fill="#d71920" opacity="0.15"/>
</svg>
