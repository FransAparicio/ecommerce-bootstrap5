<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Laptop negra con pantalla verde">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#e3f4ea"/>
      <stop offset="1" stop-color="#f4f8f6"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5d3b"/>
      <stop offset="1" stop-color="#0f754b"/>
    </linearGradient>
    <pattern id="teclas" x="160" y="312" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" rx="2.5" fill="#d7e5dd"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="url(#glow)"/>
  <circle cx="300" cy="215" r="190" fill="#0b5d3b" opacity="0.06"/>

  <!-- Pantalla -->
  <rect x="140" y="90" width="320" height="205" rx="12" fill="#101817"/>
  <rect x="152" y="102" width="296" height="181" rx="6" fill="url(#screen)"/>
  <g fill="#83dbaa" opacity="0.7">
    <rect x="176" y="128" width="95" height="9" rx="4.5"/>
    <rect x="176" y="150" width="150" height="9" rx="4.5"/>
    <rect x="176" y="172" width="65" height="9" rx="4.5"/>
    <rect x="256" y="172" width="120" height="9" rx="4.5"/>
    <rect x="176" y="194" width="180" height="9" rx="4.5"/>
    <rect x="176" y="216" width="50" height="9" rx="4.5"/>
    <rect x="241" y="216" width="135" height="9" rx="4.5"/>
    <rect x="176" y="238" width="105" height="9" rx="4.5"/>
  </g>
  <circle cx="300" cy="112" r="4" fill="#16221f"/>

  <!-- Base -->
  <rect x="95" y="295" width="410" height="26" rx="13" fill="#16221f"/>
  <rect x="160" y="312" width="280" height="18" fill="url(#teclas)" opacity="0.5"/>

  <circle cx="120" cy="400" r="6" fill="#0b5d3b" opacity="0.25"/>
  <circle cx="480" cy="120" r="8" fill="#d71920" opacity="0.18"/>
</svg>
