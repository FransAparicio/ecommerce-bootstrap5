  <!-- Puntos de órbita -->
  <g fill="#0b5d3b" opacity="0.3">
    <circle cx="130" cy="120" r="8"/>
    <circle cx="470" cy="140" r="10"/>
    <circle cx="490" cy="300" r="7"/>
    <circle cx="110" cy="300" r="9"/>
  </g>

  <text x="300" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5d3b" text-anchor="middle" letter-spacing="2">PROTECCIÓN TOTAL</text>
</svg>
