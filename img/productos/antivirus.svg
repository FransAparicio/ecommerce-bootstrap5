<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Escudo de protección de antivirus">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#e3f4ea"/>
      <stop offset="1" stop-color="#f4f8f6"/>
    </radialGradient>
    <linearGradient id="escudo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f754b"/>
      <stop offset="1" stop-color="#063b27"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#glow)"/>
  <circle cx="300" cy="210" r="190" fill="#0b5d3b" opacity="0.06"/>

  <!-- Escudo -->
  <path d="M300 70 L430 120 v110 c0 90 -60 140 -130 170 c-70 -30 -130 -80 -130 -170 v-110 z" fill="url(#escudo)"/>
  <path d="M300 95 L405 133 v95 c0 75 -48 118 -105 143 c-57 -25 -105 -68 -105 -143 v-95 z" fill="#ffffff" opacity="0.15"/>

  <!-- Check -->
