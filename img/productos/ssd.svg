<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Disco sólido SSD NVMe de 1 terabyte">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#e3f4ea"/>
      <stop offset="1" stop-color="#f4f8f6"/>
    </radialGradient>
    <linearGradient id="etiqueta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5d3b"/>
      <stop offset="1" stop-color="#0f754b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#glow)"/>
  <circle cx="300" cy="210" r="190" fill="#0b5d3b" opacity="0.06"/>

  <!-- Sombra -->
  <ellipse cx="300" cy="300" rx="210" ry="14" fill="#063b27" opacity="0.12"/>

  <!-- Cuerpo -->
  <rect x="110" y="130" width="380" height="130" rx="16" fill="#16221f"/>

  <!-- Etiqueta -->
  <rect x="135" y="152" width="240" height="86" rx="10" fill="url(#etiqueta)"/>
  <text x="155" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">SSD NVMe</text>
  <text x="155" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d9f2e5">1TB • PCIe Gen4</text>

  <!-- Circuitos -->
  <g stroke="#83dbaa" stroke-width="4" opacity="0.65" fill="none">
    <path d="M395 160 h40 v20 h30"/>
    <path d="M395 185 h55 v15 h20"/>
    <path d="M395 210 h35 v20 h40"/>
  </g>
  <g fill="#83dbaa" opacity="0.65">
    <circle cx="465" cy="180" r="5"/>
    <circle cx="470" cy="200" r="5"/>
    <circle cx="465" cy="230" r="5"/>
  </g>

  <!-- Pines del conector -->
  <g fill="#0b5d3b">
    <rect x="140" y="260" width="14" height="26" rx="3"/>
    <rect x="162" y="260" width="14" height="26" rx="3"/>
    <rect x="184" y="260" width="14" height="26" rx="3"/>
    <rect x="206" y="260" width="14" height="26" rx="3"/>
    <rect x="228" y="260" width="14" height="26" rx="3"/>
    <rect x="250" y="260" width="14" height="26" rx="3"/>
    <rect x="272" y="260" width="14" height="26" rx="3"/>
    <rect x="294" y="260" width="14" height="26" rx="3"/>
    <rect x="316" y="260" width="14" height="26" rx="3"/>
    <rect x="338" y="260" width="14" height="26" rx="3"/>
  </g>
</svg>
